name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, Pack, Publish
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ./ClickUp.Client.slnx

      - name: Build
        run: dotnet build ./ClickUp.Client/ClickUp.Client.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet run --project ./ClickUp.Client.Tests/ClickUp.Client.Tests.csproj -c Release -f net8.0 --no-restore
          dotnet run --project ./ClickUp.Client.Tests/ClickUp.Client.Tests.csproj -c Release -f net9.0 --no-restore
          dotnet run --project ./ClickUp.Client.Tests/ClickUp.Client.Tests.csproj -c Release -f net10.0 --no-restore

      - name: Pack
        run: dotnet pack ./ClickUp.Client/ClickUp.Client.csproj -c Release --no-build -o ./artifacts /p:ContinuousIntegrationBuild=true

      - name: Select publish authentication method
        id: publish-auth
        shell: bash
        env:
          STATIC_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_ORG_USER: ${{ vars.NUGET_ORG_USER }}
        run: |
          if [ -n "$STATIC_NUGET_API_KEY" ]; then
            echo "method=api-key" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$NUGET_ORG_USER" ]; then
            echo "method=trusted-publishing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Configure secrets.NUGET_API_KEY or vars.NUGET_ORG_USER before publishing." >&2
          exit 1

      - name: NuGet login via Trusted Publishing
        if: steps.publish-auth.outputs.method == 'trusted-publishing'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_ORG_USER }}

      - name: Publish to nuget.org
        shell: bash
        env:
          STATIC_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          TEMP_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          API_KEY="$STATIC_NUGET_API_KEY"
          if [ -z "$API_KEY" ]; then
            API_KEY="$TEMP_NUGET_API_KEY"
          fi

          if [ -z "$API_KEY" ]; then
            echo "NuGet API key is empty." >&2
            exit 1
          fi

          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
